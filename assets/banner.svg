<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f778ba" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Decorative mesh network -->
  <g opacity="0.15" stroke="#58a6ff" stroke-width="1" fill="none">
    <circle cx="1050" cy="120" r="4" fill="#58a6ff"/>
    <circle cx="1130" cy="200" r="4" fill="#7ee787"/>
    <circle cx="1060" cy="290" r="4" fill="#f778ba"/>
    <circle cx="960"  cy="220" r="4" fill="#58a6ff"/>
    <line x1="1050" y1="120" x2="1130" y2="200"/>
    <line x1="1130" y1="200" x2="1060" y2="290"/>
    <line x1="1060" y1="290" x2="960"  y2="220"/>
    <line x1="960"  y1="220" x2="1050" y2="120"/>
    <line x1="1050" y1="120" x2="1060" y2="290"/>
  </g>

  <!-- Terminal frame -->
  <rect x="80" y="90" width="760" height="240" rx="12" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="90" width="760" height="36" rx="12" fill="#161b22"/>
  <circle cx="108" cy="108" r="7" fill="#ff5f56"/>
  <circle cx="132" cy="108" r="7" fill="#ffbd2e"/>
  <circle cx="156" cy="108" r="7" fill="#27c93f"/>

  <text x="112" y="118" font-family="monospace" font-size="14" fill="#8b949e">
    babak@server: ~/bsheasytier
  </text>

  <text x="110" y="180" font-family="monospace" font-size="28" fill="#58a6ff">$ sudo ./bsheasytier.sh</text>
  <text x="110" y="225" font-family="monospace" font-size="22" fill="#7ee787">✓ EasyTier Manager v1.0</text>
  <text x="110" y="265" font-family="monospace" font-size="16" fill="#c9d1d9">Cross-distro • TOML • Multi-instance</text>
  <text x="110" y="295" font-family="monospace" font-size="14" fill="#8b949e">Debian  Ubuntu  RHEL  Fedora  Arch  openSUSE</text>

  <!-- Header -->
  <text x="80" y="45" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f0f6fc">
    EasyTier Manager
  </text>
  <text x="1120" y="45" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="end">
    github.com/bshnetwork/bsheasytier
  </text>

  <!-- Author block -->
  <text x="880" y="130" font-family="sans-serif" font-size="14" fill="#8b949e">built by</text>
  <text x="880" y="170" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f0f6fc">Babak Keshavarz</text>
  <text x="880" y="200" font-family="monospace" font-size="13" fill="#0a66c2">in/ babak keshavarz</text>

  <line x1="880" y1="220" x2="1120" y2="220" stroke="url(#glow)" stroke-width="2"/>

  <text x="880" y="252" font-family="monospace" font-size="13" fill="#f0f6fc">gh/ bshnetwork</text>
  <text x="880" y="278" font-family="monospace" font-size="13" fill="#8b949e">github.com/bshnetwork/bsheasytier</text>

  <text x="80" y="380" font-family="sans-serif" font-size="14" fill="#8b949e">
    One script to install, configure &amp; manage EasyTier on any Linux distro.
  </text>
</svg>
